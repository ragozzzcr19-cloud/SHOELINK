<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOELINK</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --accent:#ff6a2b; --accent2:#ffb703;
    --text:#f5f6f8; --muted:#9aa1ac; --card:#1d212b; --line:#2a2f3a;
    --ok:#3ecf8e; --danger:#ff5470;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #stickyTop{position:sticky;top:0;z-index:50;background:var(--bg);}
  header{background:linear-gradient(120deg,#12141a,#1a1e27);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .logo{font-weight:800;font-size:1.5rem;letter-spacing:1px;}
  .logo span{color:var(--accent);}
  .vendor-box{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);margin-left:auto;}
  .vendor-box input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;width:150px;font-size:.85rem;}
  .header-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-left:auto;}
  .icon-btn{position:relative;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:2px;}
  .icon-btn:hover{border-color:var(--accent);}
  .icon-btn-cart{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700;font-size:1.05rem;padding:12px 20px;}
  .icon-btn-cart:hover{border-color:var(--accent);filter:brightness(1.05);}
  .icon-btn-cart .ib-icon{font-size:1.2rem;}
  #cartCount{background:var(--accent);color:#111;font-weight:700;border-radius:999px;padding:1px 7px;font-size:.75rem;position:absolute;top:-8px;right:-8px;}
  .ib-label-short{display:none;}
  main{max-width:1300px;margin:0 auto;padding:20px;}
  .filters{max-width:1300px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bg);border-bottom:1px solid var(--line);}
  .filters .group{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:.82rem;white-space:nowrap;}
  .chip.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700;}
  #search{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 16px;font-size:.85rem;flex:1;min-width:180px;}
  .brand-dropdown{display:block;position:relative;}
  .dropdown-toggle{display:flex;align-items:center;gap:6px;background:var(--accent);color:#111;border-color:var(--accent);font-weight:700;}
  .dropdown-toggle .caret{font-size:.7rem;}
  .brand-dropdown-list{position:absolute;top:calc(100% + 6px);left:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;display:none;flex-direction:column;gap:4px;min-width:190px;z-index:60;box-shadow:0 10px 28px rgba(0,0,0,.45);}
  .brand-dropdown-list.show{display:flex;}
  .brand-dropdown-list .chip{width:100%;text-align:left;}
  @media (max-width:680px){
    header{padding:10px 14px;gap:8px;}
    .header-actions{gap:6px;}
    .icon-btn{padding:8px 10px;}
    .ib-label{display:none;}
    .ib-label-short{display:inline;}
    .filters{padding:10px 14px;}
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
  .grid.large{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
  .grid.compact{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#fff;cursor:zoom-in;}
  .card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .brand-tag{font-size:.68rem;letter-spacing:1px;color:var(--accent2);font-weight:700;}
  .p-name{font-size:.92rem;font-weight:600;line-height:1.25;min-height:2.3em;}
  .p-sku{font-size:.68rem;color:var(--muted);}
  .p-price{font-size:1.15rem;font-weight:800;color:var(--text);margin-top:2px;}
  .card-compact{cursor:pointer;}
  .card-compact img{cursor:pointer;}
  .card-compact .card-body{padding:8px 9px 10px;gap:2px;}
  .card-compact .p-sku{font-size:.6rem;color:var(--accent2);font-weight:700;}
  .card-compact .p-price-compact{font-size:.9rem;font-weight:800;color:var(--text);}
  .card-compact .p-name{font-size:.72rem;font-weight:500;line-height:1.2;min-height:0;color:var(--muted);}
  .p-price-credit{font-size:.78rem;color:var(--muted);margin-top:-4px;}
  .p-price-credit b{color:var(--accent2);}
  .coupon-row{display:flex;gap:5px;margin-top:2px;}
  .coupon-input{flex:1;min-width:0;background:#12141a;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 7px;font-size:.72rem;}
  .coupon-btn{background:var(--accent);color:#111;border:none;border-radius:6px;padding:4px 10px;font-size:.72rem;font-weight:700;cursor:pointer;white-space:nowrap;}
  .sizes-label{font-size:.72rem;color:var(--muted);margin-top:2px;}
  .sizes{display:flex;flex-wrap:wrap;gap:5px;}
  .size-btn{border:1px solid var(--line);background:#12141a;color:var(--text);border-radius:6px;padding:4px 7px;font-size:.72rem;cursor:pointer;min-width:34px;text-align:center;}
  .size-btn.selected{background:var(--accent);border-color:var(--accent);color:#111;font-weight:700;}
  .size-btn.disabled{color:#454b57;text-decoration:line-through;cursor:not-allowed;background:#14161b;}
  .add-btn{margin-top:auto;background:var(--accent);color:#111;border:none;border-radius:9px;padding:10px;font-weight:700;cursor:pointer;font-size:.85rem;}
  .add-btn:disabled{background:#3a3f4a;color:#7a8090;cursor:not-allowed;}
  .empty{text-align:center;color:var(--muted);padding:60px 0;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;}
  .overlay.show{display:block;}
  #cartDrawer{position:fixed;top:0;right:-420px;width:400px;max-width:92vw;height:100%;background:var(--panel);z-index:90;transition:right .25s ease;display:flex;flex-direction:column;border-left:1px solid var(--line);overflow-y:auto;}
  #cartDrawer.open{right:0;}
  .drawer-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
  .drawer-head h3{margin:0;}
  .close-x{background:none;border:none;color:var(--text);font-size:1.4rem;cursor:pointer;}
  .cart-items{flex:0 1 auto;max-height:38vh;overflow-y:auto;padding:10px 16px;flex-shrink:0;}
  .cart-item{display:flex;gap:10px;border-bottom:1px solid var(--line);padding:10px 0;}
  .cart-item img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#fff;cursor:zoom-in;}
  .cart-item .ci-info{flex:1;font-size:.82rem;}
  .cart-item .ci-name{font-weight:600;}
  .cart-item .ci-sku{color:var(--accent2);font-size:.72rem;font-weight:700;margin-top:1px;}
  .cart-item .ci-meta{color:var(--muted);font-size:.75rem;}
  .ci-remove{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.75rem;}
  .drawer-foot{border-top:1px solid var(--line);padding:14px 18px;display:flex;flex-direction:column;gap:10px;}
  .drawer-foot label{font-size:.78rem;color:var(--muted);}
  .drawer-foot input{background:#12141a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font-size:.88rem;}
  .total-row{display:flex;justify-content:space-between;font-weight:800;font-size:1.05rem;margin-top:2px;}
  .wa-btn{background:#25D366;color:#06210f;border:none;border-radius:9px;padding:12px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;display:block;width:100%;font-size:.92rem;}
  .wa-btn:hover{filter:brightness(1.05);}
  .bank-badge{color:#fff;font-weight:800;font-size:.66rem;padding:4px 9px;border-radius:6px;letter-spacing:.4px;}
  #paymentInfo{background:#12141a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .pay-method-btn{flex:1;background:#1d212b;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;font-size:.8rem;cursor:pointer;font-weight:600;}
  .pay-method-btn.active{background:var(--accent);border-color:var(--accent);color:#111;}

  #adminModal{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:20px;}
  #adminModal.show{display:flex;}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:900px;max-height:88vh;overflow-y:auto;padding:20px;}
  .modal-box h2{margin-top:0;}
  .pin-box{max-width:280px;margin:40px auto;text-align:center;}
  .pin-box input{width:100%;background:#12141a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;font-size:1rem;text-align:center;letter-spacing:4px;margin:12px 0;}
  .btn{background:var(--accent);color:#111;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;}
  .btn.secondary{background:#2a2f3a;color:var(--text);}
  .btn.danger{background:var(--danger);color:#fff;}
  .admin-row{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:100px 1fr;gap:12px;}
  .admin-row img{width:90px;height:90px;object-fit:cover;border-radius:8px;background:#fff;display:block;}
  .admin-img-col{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .file-label{background:#2a2f3a;color:var(--text);border-radius:6px;padding:5px 8px;font-size:.65rem;cursor:pointer;text-align:center;width:90px;}
  .file-label:hover{background:#3a3f4a;}
  .admin-fields{display:flex;flex-direction:column;gap:6px;}
  .admin-fields .row2{display:flex;gap:8px;flex-wrap:wrap;}
  .admin-fields input[type=text],.admin-fields input[type=number]{background:#12141a;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font-size:.82rem;}
  .size-edit-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .size-edit{display:flex;align-items:center;gap:4px;background:#12141a;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:.72rem;}
  .size-edit input{width:38px;background:none;border:none;color:var(--text);text-align:center;}
  .admin-actions{display:flex;gap:8px;margin-top:6px;}
  .admin-top-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .file-input{font-size:.72rem;color:var(--muted);}
  footer{text-align:center;color:var(--muted);font-size:.75rem;padding:30px 10px 40px;}

  #imgZoomModal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.88);}
  #imgZoomModal.show{display:flex;}
  #imgZoomModal img{max-width:92vw;max-height:88vh;border-radius:10px;background:#fff;cursor:default;}
</style>
</head>
<body>

<div id="stickyTop">
  <header>
    <div class="logo" onclick="openAdminPrompt()" style="cursor:pointer;" title="Administrador">SHOE<span>LINK</span></div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openConsultChat()" title="Chat de consultas" aria-label="Chat de consultas"><span class="ib-icon">💬</span><span class="ib-label"> Chat de consultas</span><span class="ib-label-short"> Chat</span></button>
      <button class="icon-btn" onclick="shareCatalog()" title="Compartir catálogo" aria-label="Compartir catálogo"><span class="ib-icon">📤</span><span class="ib-label"> Compartir catálogo</span><span class="ib-label-short"> Compartir</span></button>
      <button class="icon-btn" onclick="exportCatalogPDF()" title="Descargar PDF" aria-label="Descargar PDF"><span class="ib-icon">📄</span><span class="ib-label"> Descargar PDF</span><span class="ib-label-short"> PDF</span></button>
      <button class="icon-btn icon-btn-cart" onclick="openCart()" title="Carrito" aria-label="Carrito"><span class="ib-icon">🛒</span><span class="ib-label"> Carrito</span><span class="ib-label-short"> Carrito</span> <span id="cartCount">0</span></button>
    </div>
  </header>

  <div class="filters">
    <input id="search" type="text" placeholder="Buscar modelo, marca o código..." oninput="renderGrid()">
    <div class="brand-dropdown" id="brandDropdown">
      <button type="button" class="chip dropdown-toggle" id="brandDropdownBtn" onclick="toggleBrandDropdown()">Todas las marcas <span class="caret">▾</span></button>
      <div class="brand-dropdown-list" id="brandDropdownList"></div>
    </div>
    <div class="group" id="genderFilters"></div>
  </div>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>SHOELINK &middot; Catálogo de calzado &middot; Pedidos vía WhatsApp</footer>

<div class="overlay" id="overlay" onclick="closeAllOverlays()"></div>

<div id="cartDrawer">
  <div class="drawer-head">
    <h3>Tu carrito</h3>
    <button class="close-x" onclick="closeCart()">&times;</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="drawer-foot">
    <div>
      <label>Nombre del cliente</label>
      <input id="customerName" type="text" placeholder="Nombre completo" oninput="renderCart()">
    </div>
    <div>
      <label>Celular del cliente</label>
      <input id="customerPhone" type="tel" placeholder="Ej. 8888-8888" oninput="renderCart()">
    </div>
    <div>
      <label>Contacto</label>
      <input id="vendorInput" type="text" placeholder="Nombre de contacto">
    </div>
    <div id="cartCouponBox"></div>
    <div class="total-row"><span id="cartTotalLabel">Total</span><span id="cartTotal">¢0</span></div>
    <div id="paymentInfo"></div>
    <button id="waLink" class="wa-btn" onclick="sendOrder()">Enviar pedido por WhatsApp</button>
  </div>
</div>

<div id="adminModal">
  <div class="modal-box" id="adminModalBox"></div>
</div>

<div id="imgZoomModal" onclick="closeImgZoom()">
  <button class="close-x" onclick="closeImgZoom()" style="position:absolute;top:18px;right:26px;color:#fff;font-size:2rem;z-index:2;">&times;</button>
  <img id="imgZoomPic" src="" onclick="event.stopPropagation()">
</div>

const SEED_VERSION = "1785159694";

let products = [];
let cart = [];
let activeBrand = "ALL";
let activeGender = "ALL";
let adminUnlocked = false;

function loadProductsLocal(){
  const storedVersion = localStorage.getItem("shoelink_seed_version");
  if(storedVersion === SEED_VERSION){
    const raw = localStorage.getItem("shoelink_products");
    if(raw){ return JSON.parse(raw); }
  }
  // primera visita, o el catálogo publicado cambió desde la última visita:
  // se toma la versión más reciente publicada en el archivo.
  const seed = JSON.parse(JSON.stringify(PRODUCTS_SEED));
  localStorage.setItem("shoelink_products", JSON.stringify(seed));
  localStorage.setItem("shoelink_seed_version", SEED_VERSION);
  return seed;
}

function saveProducts(){
  if(firebaseEnabled){
    fbDb.ref("products").set(products);
  } else {
    localStorage.setItem("shoelink_products", JSON.stringify(products));
  }
}

// Arranca la app: si hay Firebase conectado, escucha cambios en vivo (tiempo real
// para todos los que tengan la página abierta). Si no, usa el catálogo guardado
// en este navegador (comportamiento anterior).
// Ordena las tallas de cada modelo de menor a mayor automáticamente (7, 7.5, 8, 8.5...).
function sortProductSizes(p){
  if(p && Array.isArray(p.sizes)){
    p.sizes.sort((a,b)=> parseFloat(a.size) - parseFloat(b.size));
  }
}
function sortAllProductSizes(){
  products.forEach(sortProductSizes);
}
function initProducts(){
  if(firebaseEnabled){
    const ref = fbDb.ref("products");
    ref.once("value").then(snap=>{
      if(!snap.exists()){
        ref.set(JSON.parse(JSON.stringify(PRODUCTS_SEED)));
      }
    });
    ref.on("value", snap=>{
      const val = snap.val();
      if(val){
        products = val;
        sortAllProductSizes();
        renderFilters();
        renderGrid();
        if(adminUnlocked) renderAdminList();
      }
    });
  } else {
    products = loadProductsLocal();
    sortAllProductSizes();
    renderFilters();
    renderGrid();
  }
}

let settings = { accountNumber: "", sinpePhone: "", accountHolderName: "Víctor Ramírez R.", specialDiscountPercent: 0, couponEnabled: true };
let selectedPaymentMethod = null;
let paymentDetailTimer = null;
function loadSettingsLocal(){
  const raw = localStorage.getItem("shoelink_settings");
  const parsed = raw ? JSON.parse(raw) : {};
  return { accountNumber: "", sinpePhone: "", accountHolderName: "Víctor Ramírez R.", specialDiscountPercent: 0, couponEnabled: true, ...parsed };
}
// Cupón del carrito: vive solo en el navegador de cada cliente, nunca se sincroniza
// con Firebase ni afecta lo que ven los demás usuarios ni la vista general del catálogo.
let cartCouponPercent = Number(localStorage.getItem("shoelink_cart_coupon")) || 0;
function parseCouponPercent(code){
  const digits = (code||"").replace(/\D/g, "");
  if(digits.length===0) return 0;
  const lastTwo = digits.slice(-2);
  const pct = parseInt(lastTwo, 10);
  return isNaN(pct) ? 0 : Math.min(pct, 100);
}
function applyCartCoupon(){
  const input = document.getElementById("cartCouponInput");
  if(!input) return;
  const code = input.value.trim();
  if(!code){
    cartCouponPercent = 0;
  } else {
    const pct = parseCouponPercent(code);
    if(pct<=0){
      alert("Ese código de cupón no es válido.");
      return;
    }
    cartCouponPercent = pct;
  }
  localStorage.setItem("shoelink_cart_coupon", String(cartCouponPercent));
  renderCart();
}

// Precio que se muestra en el catálogo general: nunca incluye el cupón personal del
// carrito, solo el descuento especial general que haya configurado el vendedor.
// Rebaja específica del modelo (puesta por Viktor en Administrador) tiene prioridad;
// si el modelo no tiene rebaja propia, se usa el descuento especial general.
function activeDiscountPercent(p){
  const productPct = Number(p.discountPercent) || 0;
  if(productPct > 0) return productPct;
  return Number(settings.specialDiscountPercent) || 0;
}
function gridPrice(p){
  const pct = activeDiscountPercent(p);
  if(pct<=0) return p.price;
  return Math.round((p.price * (1 - pct/100)) / 100) * 100;
}

// Precio efectivo dentro del carrito: si hay un cupón de carrito aplicado, tiene
// prioridad; si no, cae al descuento especial general (o al precio normal).
function effectivePrice(p){
  if(cartCouponPercent>0){
    return Math.round((p.price * (1 - cartCouponPercent/100)) / 100) * 100;
  }
  return gridPrice(p);
}
function hasActiveDiscount(){
  return cartCouponPercent>0 || (Number(settings.specialDiscountPercent)||0)>0;
}
function updateCartTotalDisplay(total){
  const totalEl = document.getElementById("cartTotal");
  const labelEl = document.getElementById("cartTotalLabel");
  if(totalEl) totalEl.textContent = formatPrice(total);

  return "¢" + num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");

function renderGrid(){
  const grid = document.getElementById("grid");
  const q = document.getElementById("search").value.trim().toLowerCase();
  let list = products.filter(p=>{
    if(p.published===false) return false; // borradores sin terminar: solo visibles en admin
    if(activeBrand!=="ALL" && p.brand!==activeBrand) return false;
    if(activeGender!=="ALL" && p.gender!==activeGender) return false;
    if(q && !(p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || (p.sku||"").toLowerCase().includes(q))) return false;
    return true;
  });
  // "Ver todo" (todas las marcas): grid compacto en miniatura para navegar rápido.
  // Al elegir una marca específica: tarjetas grandes con todo el detalle y tallas.
  const compactMode = activeBrand === "ALL";
  grid.classList.toggle("compact", compactMode);
  grid.classList.toggle("large", !compactMode);
  if(list.length===0){
    grid.innerHTML = `<div class="empty">No hay modelos que coincidan con tu búsqueda.</div>`;
    return;
  }
  if(compactMode){
    grid.innerHTML = list.map(p=>{
      const availableSizes = p.sizes.filter(s=>s.qty>0);
      return `<div class="card card-compact" data-id="${p.id}" onclick="setBrand('${p.brand}')">
        <img src="${p.image||''}" alt="${p.name}">
        <div class="card-body">
          <div class="p-sku">${p.sku||""}</div>
          <div class="p-price-compact">${formatPrice(gridPrice(p))}</div>
          <div class="p-name">${p.name}</div>
          ${availableSizes.length===0 ? `<div style="color:var(--muted);font-size:.68rem;">Agotado</div>` : ""}
        </div>
      </div>`;
    }).join("");
    return;
  }
  grid.innerHTML = list.map(p=>{
    const availableSizes = p.sizes.filter(s=>s.qty>0);
    const sizesHtml = availableSizes.length
      ? availableSizes.map(s=>`<div class="size-btn" data-size="${s.size}" onclick="selectSize(${p.id}, '${s.size}', this)">${s.size}</div>`).join("")
      : `<div style="color:var(--muted);font-size:.78rem;">Agotado</div>`;
    return `<div class="card" data-id="${p.id}">
      <img src="${p.image||''}" alt="${p.name}" onclick="openImageZoom('${p.image||''}')">
      <div class="card-body">
        <div class="brand-tag">${p.brand}</div>
        <div class="p-name">${p.name}</div>
        <div class="p-sku">${p.sku||""}${p.gender?" · "+p.gender:""}</div>
        <div class="p-price">${(() => {
          const pct = activeDiscountPercent(p);
          if(pct>0){
            return `Descuento especial ${pct}% OFF: <s style="color:var(--muted);font-weight:400;">${formatPrice(p.price)}</s> ${formatPrice(gridPrice(p))}`;
          }
          return `Descuento especial: ${formatPrice(p.price)}`;
        })()}</div>
        <div class="p-price-credit">Crédito: <b>${formatPrice(p.creditPrice||p.price)}</b></div>
        <div class="sizes-label">Tallas disponibles</div>
        <div class="sizes">${sizesHtml}</div>
        <button class="add-btn" id="add-${p.id}" disabled onclick="addToCart(${p.id})">${availableSizes.length ? "Elegí una talla" : "Agotado"}</button>
      </div>
    </div>`;
  }).join("");
}

function selectSize(pid, size, el){
  const card = el.closest(".card");
  card.querySelectorAll(".size-btn").forEach(b=>b.classList.remove("selected"));
  el.classList.add("selected");
  const btn = document.getElementById("add-"+pid);
  btn.disabled = false;
  btn.textContent = "Agregar al carrito - Talla " + size;
}

function addToCart(pid){
  const size = getSelectedSize(pid);
  if(!size) return;
  const product = products.find(p=>p.id===pid);
  const sizeObj = product.sizes.find(s=>s.size===size);
  if(!sizeObj || sizeObj.qty<=0){
    alert("Esa talla ya no está disponible (agotada).");
    renderGrid();
    return;
  }
  // reserve immediately: reduce real inventory so it shows "agotado" for everyone else
  sizeObj.qty -= 1;
  saveProducts();
  cart.push({pid, size, addedAt: Date.now()});
  saveCart();
  updateCartCount();
  renderGrid();
  openCart();
}

function updateCartCount(){
  document.getElementById("cartCount").textContent = cart.length;
}

function renderCartCoupon(){
  const box = document.getElementById("cartCouponBox");
  if(!box) return;
  if(settings.couponEnabled===false){
    // El vendedor desactivó el cupón personalizado: se oculta el campo y se
    // limpia cualquier cupón que hubiera quedado activo en este navegador.
    if(cartCouponPercent>0){
      cartCouponPercent = 0;
      localStorage.removeItem("shoelink_cart_coupon");
    }
    box.innerHTML = "";
    return;
  }
  box.innerHTML = `
    <label>Código de cupón</label>
    <div style="display:flex;gap:6px;">
      <input id="cartCouponInput" type="text" placeholder="Ej. 0010" style="flex:1;">

    </div>
    ${cartCouponPercent>0 ? `<div style="color:var(--ok);font-size:.75rem;margin-top:4px;">Cupón aplicado: ${cartCouponPercent}% OFF</div>` : ""}
  `;
}

function renderCart(){
  renderCartCoupon();
  const wrap = document.getElementById("cartItems");
  if(cart.length===0){
    wrap.innerHTML = `<div class="empty">Tu carrito está vacío.</div>`;
  } else {
    wrap.innerHTML = cart.map((c,i)=>{
      const p = products.find(pp=>pp.id===c.pid);
      if(!p) return "";
      return `<div class="cart-item">
        <img src="${p.image||''}" onclick="openImageZoom('${p.image||''}')">
        <div class="ci-info">
          <div class="ci-name">${p.brand} - ${p.name}</div>
          <div class="ci-sku">Código: ${p.sku || "—"}</div>
          <div class="ci-meta">Talla ${c.size} · ${formatPrice(effectivePrice(p))}</div>
          <button class="ci-remove" onclick="removeFromCart(${i})">Quitar</button>
        </div>
      </div>`;
    }).join("");
  }
  const total = cart.reduce((sum,c)=>{
    const p = products.find(pp=>pp.id===c.pid);
    return sum + (p ? effectivePrice(p) : 0);
  },0);
  updateCartTotalDisplay(total);
  updateCartCount();
  updateWaLink();
}

function removeFromCart(i){
  const c = cart[i];
  const p = products.find(pp=>pp.id===c.pid);
  if(p){
    const sizeObj = p.sizes.find(s=>s.size===c.size);
    if(sizeObj){ sizeObj.qty += 1; } // release the reserved pair back to stock
    saveProducts();
  }
  cart.splice(i,1);
  saveCart();
  renderCart();
  renderGrid();
}

function updateWaLink(){
  const total = cart.reduce((sum,c)=>{
    const p = products.find(pp=>pp.id===c.pid);
    return sum + (p ? effectivePrice(p) : 0);
  },0);
  updateCartTotalDisplay(total);
}

function sendOrder(){
  if(cart.length===0){
    alert("Tu carrito está vacío.");
    return;
  }
  const customer = document.getElementById("customerName").value.trim() || "Cliente";
  const phone = document.getElementById("customerPhone").value.trim();
  const vendor = document.getElementById("vendorInput").value.trim();
  let msg = `Pedido SHOELINK\n`;
  msg += `Cliente: ${customer}\n`;
  msg += `Celular: ${phone || "(no indicado)"}\n`;
  msg += `Contacto: ${vendor || "(sin asignar)"}\n\n`;
  cart.forEach(c=>{
    const p = products.find(pp=>pp.id===c.pid);
    if(!p) return;
    msg += `- ${p.brand} ${p.name} | Código: ${p.sku||"—"} | Talla ${c.size} | ${formatPrice(effectivePrice(p))}\n`;
  });
  const total = cart.reduce((sum,c)=>{
    const p = products.find(pp=>pp.id===c.pid);
    return sum + (p ? effectivePrice(p) : 0);
  },0);
  if(cartCouponPercent>0){
    msg += `\nCupón aplicado: ${cartCouponPercent}% OFF`;
  }
  msg += `\nTotal: ${formatPrice(total)}`;
  const holder = settings.accountHolderName || "Víctor";
  if(selectedPaymentMethod==="bac" && settings.accountNumber){
    msg += `\n\nForma de pago: EN CUENTA BAC DE ${holder.toUpperCase()} - ${settings.accountNumber}`;
    msg += `\n(Enviar copia del comprobante a este WhatsApp con el nombre de quien hizo la transferencia)`;
  } else if(selectedPaymentMethod==="sinpe" && settings.sinpePhone){
    msg += `\n\nForma de pago: POR SINPE MÓVIL DE ${holder.toUpperCase()} - ${settings.sinpePhone}`;
    msg += `\n(Enviar copia del comprobante a este WhatsApp con el nombre de quien hizo el SINPE)`;
  }
  if(SITE_URL && SITE_URL !== "TU-LINK-AQUI"){
    msg += `\n\nVer catálogo: ${SITE_URL}`;
  }
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
  // el pedido ya quedó reservado en el inventario; se cuenta como vendido por modelo
  // (para el resumen por marca en Administrador) y se limpia el carrito y los datos del cliente
  cart.forEach(c=>{
    const p = products.find(pp=>pp.id===c.pid);
    if(p){ p.soldCount = (Number(p.soldCount)||0) + 1; }
  });
  saveProducts();
  cart = [];
  saveCart();
  document.getElementById("customerName").value = "";
  document.getElementById("customerPhone").value = "";
  selectedPaymentMethod = null;
  cartCouponPercent = 0;
  localStorage.removeItem("shoelink_cart_coupon");
  renderCart();
  renderGrid();
  renderPaymentInfo();
}

async function exportCatalogPDF(){
  if(typeof window.jspdf === "undefined"){
    alert("No se pudo cargar la herramienta de PDF. Revisá tu conexión a internet e intentá de nuevo.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const pageWidth = 210, pageHeight = 297, margin = 10;
  const cols = 2, rows = 3;
  const cellW = (pageWidth - margin*2) / cols;
  const cellH = (pageHeight - margin*2) / rows;
  const imgW = cellW - 10, imgH = imgW * 0.72;
  const list = products.filter(p=>p.published !== false);

  const drawHeader = ()=>{
    doc.setFontSize(16);
    doc.setTextColor(20,20,20);
    doc.text("SHOELINK - Catálogo", pageWidth/2, 12, {align:"center"});
    if(SITE_URL && SITE_URL !== "TU-LINK-AQUI"){
      doc.setFontSize(9);
      doc.setTextColor(120,120,120);
      doc.text(SITE_URL, pageWidth/2, 17, {align:"center"});
    }
  };
  drawHeader();
  const startY = 24;

  list.forEach((p, i)=>{
    const perPage = cols*rows;
    const posInPage = i % perPage;
    if(i>0 && posInPage===0){
      doc.addPage();
      drawHeader();
    }
    const col = posInPage % cols;
    const row = Math.floor(posInPage / cols);
    const x = margin + col*cellW + 5;
    const y = startY + row*cellH;

    try{
      if(p.image){
        // fondo blanco parejo para que todas las fotos se vean del mismo tamaño de casilla
        doc.setFillColor(255,255,255);
        doc.rect(x, y, imgW, imgH, "F");
        const props = doc.getImageProperties(p.image);
        const ratio = props.width / props.height;
        let drawW = imgW, drawH = imgW / ratio;
        if(drawH > imgH){ drawH = imgH; drawW = imgH * ratio; }
        const offX = x + (imgW - drawW) / 2;
        const offY = y + (imgH - drawH) / 2;
        doc.addImage(p.image, "JPEG", offX, offY, drawW, drawH);
      }
    }catch(e){ /* si la imagen falla, seguimos sin ella */ }

    let ty = y + imgH + 5;
    doc.setFontSize(9);
    doc.setTextColor(20,20,20);
    doc.text(`${p.brand} - ${p.name}`, x, ty, {maxWidth: cellW-10});
    ty += 5;
    doc.setFontSize(8);
    doc.setTextColor(90,90,90);
    doc.text(`Código: ${p.sku || "-"}`, x, ty);
    ty += 4;
    doc.setTextColor(20,20,20);
    doc.text(`Desc. especial: ${formatPrice(gridPrice(p))}`, x, ty, {maxWidth: cellW-10});
    ty += 4;
    doc.setTextColor(90,90,90);
    doc.text(`Crédito: ${formatPrice(p.creditPrice || p.price)}`, x, ty);
    ty += 4;
    const sizesTxt = p.sizes.filter(s=>s.qty>0).map(s=>s.size).join(", ") || "Agotado";
    doc.text(`Tallas disponibles: ${sizesTxt}`, x, ty, {maxWidth: cellW-10});
  });

  doc.save("catalogo-shoelink.pdf");
  incrementStat("pdfDownloads");
}

// Resumen de inventario y ventas agrupado por marca, para que Viktor vea de un
// vistazo cuántos pares tiene disponibles, cuánto valen, y cuántos ha vendido.
function computeBrandSummary(){
  const map = {};
  products.forEach(p=>{
    const brand = p.brand || "Sin marca";
    const totalQty = (p.sizes||[]).reduce((s,sz)=> s + (Number(sz.qty)||0), 0);
    if(!map[brand]) map[brand] = { pairs:0, value:0, sold:0 };
    map[brand].pairs += totalQty;
    map[brand].value += totalQty * (Number(p.price)||0);
    map[brand].sold += Number(p.soldCount)||0;
  });
  return map;
}
function renderBrandSummaryHtml(){
  const summary = computeBrandSummary();
  const brands = Object.keys(summary).sort();
  let grandPairs = 0, grandValue = 0, grandSold = 0;
  const rows = brands.map(b=>{
    const d = summary[b];
    grandPairs += d.pairs; grandValue += d.value; grandSold += d.sold;
    return `<tr style="border-top:1px solid var(--line);">
      <td style="padding:6px 8px;">${b}</td>
      <td style="padding:6px 8px;">${d.pairs}</td>
      <td style="padding:6px 8px;">${formatPrice(d.value)}</td>
      <td style="padding:6px 8px;">${d.sold}</td>
    </tr>`;
  }).join("");
  return `<div style="background:#12141a;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px;overflow-x:auto;">
    <div style="font-weight:700;margin-bottom:8px;font-size:.9rem;">Resumen por marca</div>
    <table style="width:100%;border-collapse:collapse;font-size:.8rem;white-space:nowrap;">
      <thead><tr style="text-align:left;color:var(--muted);font-size:.72rem;">
        <th style="padding:4px 8px;">Marca</th>
        <th style="padding:4px 8px;">Pares disponibles</th>
        <th style="padding:4px 8px;">Valor total</th>
        <th style="padding:4px 8px;">Pares vendidos</th>
      </tr></thead>
      <tbody>
        ${rows || `<tr><td style="padding:6px 8px;color:var(--muted);" colspan="4">Sin modelos todavía.</td></tr>`}
        <tr style="border-top:2px solid var(--accent);font-weight:700;">
          <td style="padding:6px 8px;">TOTAL</td>
          <td style="padding:6px 8px;">${grandPairs}</td>
          <td style="padding:6px 8px;">${formatPrice(grandValue)}</td>
          <td style="padding:6px 8px;">${grandSold}</td>
        </tr>
      </tbody>
    </table>
  </div>`;
}

function renderAdminList(){
  const list = document.getElementById("adminList");

    const sizeInputs = p.sizes.map((s,si)=>`

        <input type="number" min="0" value="${s.qty}" onchange="updateSizeQty(${p.id}, ${si}, this.value)">
        <span onclick="removeSize(${p.id}, ${si})" style="cursor:pointer;color:var(--danger);">×</span>
      </div>`).join("");
    const isPublished = p.published !== false;
    return `<div class="admin-row" data-pid="${p.id}">
      <div class="admin-img-col">
        <img src="${p.image||''}">
        <label class="file-label" for="file-${p.id}">Cambiar imagen</label>
        <input id="file-${p.id}" style="display:none" type="file" accept="image/*" onchange="replaceImage(${p.id}, this)">
      </div>
      <div class="admin-fields">
        <div class="row2">
          <input type="text" value="${p.brand}" onchange="updateField(${p.id},'brand',this.value)" placeholder="Marca" style="width:120px;">
          <input type="text" value="${p.name}" onchange="updateField(${p.id},'name',this.value)" placeholder="Nombre / estilo" style="flex:1;min-width:160px;">
          <input type="text" value="${p.sku||''}" onchange="updateField(${p.id},'sku',this.value)" placeholder="SKU" style="width:120px;">
          <input type="text" value="${p.gender||''}" onchange="updateField(${p.id},'gender',this.value)" placeholder="Género" style="width:90px;">
          <input type="number" value="${p.price}" onchange="updateField(${p.id},'price',Number(this.value))" placeholder="Precio contado" style="width:110px;" title="Precio de contado">
          <input type="number" value="${p.creditPrice||p.price}" onchange="updateField(${p.id},'creditPrice',Number(this.value))" placeholder="Precio crédito" style="width:110px;" title="Precio a crédito">
          <input type="number" min="0" max="100" value="${p.discountPercent||0}" onchange="updateField(${p.id},'discountPercent',Number(this.value))" placeholder="% Rebaja" style="width:100px;background:#241a12;border-color:var(--accent2);" title="Rebaja específica de este modelo. Tiene prioridad sobre el descuento especial general. Poné 0 para quitarla.">
        </div>
        <div class="size-edit-list">${sizeInputs}
          <button class="btn secondary" style="padding:3px 8px;font-size:.7rem;" onclick="addSize(${p.id})">+ talla</button>
        </div>
        <div class="admin-actions">
          <label style="display:flex;align-items:center;gap:6px;font-size:.75rem;color:${isPublished?'var(--ok)':'var(--muted)'};">
            <input type="checkbox" ${isPublished?'checked':''} onchange="togglePublished(${p.id}, this.checked)">
            ${isPublished ? 'Visible en la tienda' : 'Oculto (borrador) — no se ve en la tienda'}
          </label>
          <button class="btn danger" style="padding:6px 10px;font-size:.75rem;" onclick="deleteProduct(${p.id})">Eliminar modelo</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

function updateField(pid, field, value){
  const p = products.find(pp=>pp.id===pid);
  p[field] = value;
  saveProducts();
  renderGrid();
  renderFilters();
}
function togglePublished(pid, checked){
  const p = products.find(pp=>pp.id===pid);
  p.published = checked;
  saveProducts();
  renderAdminList();
  renderGrid();
  renderFilters();
}
function updateSizeQty(pid, idx, value){
  const p = products.find(pp=>pp.id===pid);
  p.sizes[idx].qty = Math.max(0, parseInt(value)||0);
  saveProducts();
  renderGrid();
}
function removeSize(pid, idx){
  const p = products.find(pp=>pp.id===pid);
  p.sizes.splice(idx,1);
  saveProducts();
  renderAdminList();
  renderGrid();
}
function addSize(pid){
  const p = products.find(pp=>pp.id===pid);
  const size = prompt("Talla nueva (ej. 9.5):");
  if(!size) return;
  const qty = parseInt(prompt("Cantidad disponible:","1"))||0;
  p.sizes.push({size, qty});
  sortProductSizes(p);
  saveProducts();
  renderAdminList();
  renderGrid();
}
function replaceImage(pid, input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const p = products.find(pp=>pp.id===pid);
    p.image = e.target.result;
    saveProducts();
    renderAdminList();
    renderGrid();
  };
  reader.readAsDataURL(file);
}
function deleteProduct(pid){
  if(!confirm("¿Eliminar este modelo del catálogo?")) return;
  products = products.filter(p=>p.id!==pid);
  saveProducts();
  renderAdminList();
  renderGrid();
  renderFilters();
}
function addBlankProduct(){
  const newId = Math.max(0,...products.map(p=>p.id)) + 1;
  products.push({
    id:newId, name:"Nuevo modelo", brand:"MARCA", sku:"", gender:"Hombre", price:0, creditPrice:0,
    sizes:[{size:"8",qty:1},{size:"9",qty:1},{size:"10",qty:1}],
    image:"", published:false
  });
  saveProducts();
  renderAdminList();
  renderGrid();
  renderFilters();
  alert("Se creó el borrador. Completá imagen, marca, nombre, precio y tallas, y marcá 'Visible en la tienda' cuando esté listo para publicarlo.");
}
function resetCatalog(){
  if(!confirm("Esto restaura el catálogo original y borra tus cambios de inventario. ¿Continuar?")) return;
  products = JSON.parse(JSON.stringify(PRODUCTS_SEED));
  sortAllProductSizes();
  saveProducts();
  renderAdminList();
  renderGrid();
  renderFilters();
}

async function exportUpdatedCatalog(){
  try{
    const res = await fetch(window.location.href, {cache:"no-store"});
    if(!res.ok) throw new Error("fetch failed");
    let html = await res.text();
    const newSeedJson = JSON.stringify(products);
    const pattern = /const PRODUCTS_SEED = \[.*?\];/s;
    if(!pattern.test(html)) throw new Error("no se encontró PRODUCTS_SEED");
    html = html.replace(pattern, `const PRODUCTS_SEED = ${newSeedJson};`);
    const newVersion = String(Date.now());
    const versionPattern = /const SEED_VERSION = ".*?";/;
    html = html.replace(versionPattern, `const SEED_VERSION = "${newVersion}";`);
    const blob = new Blob([html], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "index.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    alert("Se descargó el catálogo actualizado con tus tallas, precios e inventario. Subilo a la pestaña Deploys de tu sitio en Netlify: en cuanto quede publicado, tanto los clientes nuevos como los que ya habían entrado antes van a ver las tallas y precios al día, sin que ellos tengan que hacer nada.");
  } catch(e){
    alert("No se pudo generar el archivo. Este botón solo funciona cuando entrás desde el enlace publicado (https://shoelink.netlify.app), no cuando abrís el archivo directamente en tu computadora.");
  }
}
